name: CodeQL

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "38 0 * * 5"

env:
  QT_VERSION: "6.8.2"
  QT_ARCH: "win64_msvc2022_64"

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup C++
        uses: aminya/setup-cpp@v1
        with:
          compiler: msvc
          vcvarsall: true
          cmake: true
          ninja: true
          ccache: false
          clangtidy: false
          cppcheck: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}/qt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Configure CMake
        shell: pwsh
        run: |
          $qtRoot = "${{ github.workspace }}\qt\${{ env.QT_VERSION }}\msvc2022_64"
          cmake -S . -B ./build -G "Ninja Multi-Config" `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -Dchart_view_ENABLE_CLANG_TIDY=OFF `
            -Dchart_view_ENABLE_CPPCHECK=OFF `
            -Dchart_view_BUILD_FUZZ_TESTS=OFF

      - name: Build
        run: cmake --build ./build --config Debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
