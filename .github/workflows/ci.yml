name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop

env:
  QT_VERSION: "6.8.2"
  QT_ARCH: "win64_msvc2022_64"

jobs:
  windows-msvc:
    name: windows ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - RelWithDebInfo

    steps:
      - uses: actions/checkout@v6

      - name: Setup C++
        uses: aminya/setup-cpp@v1
        with:
          compiler: msvc
          vcvarsall: true
          cmake: true
          ninja: true
          ccache: true
          clangtidy: false
          cppcheck: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          dir: ${{ github.workspace }}/qt

      - name: Configure CMake
        shell: pwsh
        run: |
          $qtRoot = "${{ github.workspace }}\qt\${{ env.QT_VERSION }}\msvc2022_64"
          cmake -S . -B ./build -G "Ninja Multi-Config" `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -Dchart_view_ENABLE_CLANG_TIDY=OFF `
            -Dchart_view_ENABLE_CPPCHECK=OFF `
            -Dchart_view_BUILD_FUZZ_TESTS=OFF

      - name: Build
        run: cmake --build ./build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir ./build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install
        run: cmake --install ./build --config ${{ matrix.build_type }} --prefix ./out/install/ci-${{ matrix.build_type }}
